<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高中英文教學與備課資料庫系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 flex h-screen overflow-hidden">

  <!-- 1. 左側導覽列 (Canvas LMS Style) -->
  <aside class="w-20 bg-slate-900 text-white flex flex-col items-center py-6 space-y-6 flex-shrink-0 z-20">
    <div class="text-2xl font-bold text-indigo-400 mb-2"><i class="ph-bold ph-graduation-cap"></i></div>
    <nav class="flex flex-col space-y-4 w-full text-center">
      <button onclick="switchTab('dashboard')" class="nav-btn py-3 hover:bg-slate-800 text-gray-300 hover:text-white flex flex-col items-center text-xs gap-1 w-full border-l-4 border-transparent active-nav">
        <i class="ph-bold ph-squares-four text-xl"></i><span>儀表板</span>
      </button>
      <button onclick="switchTab('vocab')" class="nav-btn py-3 hover:bg-slate-800 text-gray-300 hover:text-white flex flex-col items-center text-xs gap-1 w-full border-l-4 border-transparent">
        <i class="ph-bold ph-book-bookmark text-xl"></i><span>7000單</span>
      </button>
      <button onclick="switchTab('grammar')" class="nav-btn py-3 hover:bg-slate-800 text-gray-300 hover:text-white flex flex-col items-center text-xs gap-1 w-full border-l-4 border-transparent">
        <i class="ph-bold ph-tree-structure text-xl"></i><span>文法庫</span>
      </button>
      <button onclick="switchTab('textbook')" class="nav-btn py-3 hover:bg-slate-800 text-gray-300 hover:text-white flex flex-col items-center text-xs gap-1 w-full border-l-4 border-transparent">
        <i class="ph-bold ph-books text-xl"></i><span>課文資源</span>
      </button>
      <button onclick="switchTab('exams')" class="nav-btn py-3 hover:bg-slate-800 text-gray-300 hover:text-white flex flex-col items-center text-xs gap-1 w-full border-l-4 border-transparent">
        <i class="ph-bold ph-exam text-xl"></i><span>大考編制</span>
      </button>
    </nav>
  </aside>

  <!-- 2. 主畫面區域 -->
  <main class="flex-1 flex flex-col h-screen overflow-y-auto">
    <!-- 頂部列：搜尋與管理按鈕 -->
    <header class="bg-white border-b border-gray-200 px-8 py-4 flex justify-between items-center sticky top-0 z-10">
      <div class="flex items-center gap-4 w-1/2">
        <h1 id="page-title" class="text-2xl font-bold text-gray-800 flex-shrink-0">資訊總覽</h1>
        <div class="relative w-full max-w-md">
          <i class="ph-bold ph-magnifying-glass absolute left-3 top-2.5 text-gray-400"></i>
          <input type="text" id="global-search" oninput="handleGlobalSearch(this.value)" placeholder="全域搜尋單字、文法或課本標題..." class="w-full pl-9 pr-4 py-1.5 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="exportDataBackup()" class="px-3 py-1.5 text-xs bg-gray-100 hover:bg-gray-200 rounded-md border text-gray-700 flex items-center gap-1">
          <i class="ph-bold ph-export"></i> 匯出備份
        </button>
        <label class="px-3 py-1.5 text-xs bg-gray-100 hover:bg-gray-200 rounded-md border text-gray-700 flex items-center gap-1 cursor-pointer">
          <i class="ph-bold ph-import"></i> 匯入備份
          <input type="file" id="import-file" class="hidden" accept=".json" onchange="importDataBackup(event)">
        </label>
      </div>
    </header>

    <!-- 頁面內容容器 -->
    <div class="p-8 flex-1 max-w-7xl w-full mx-auto space-y-8">
      
      <!-- VIEW 1: 首頁 DASHBOARD -->
      <section id="view-dashboard" class="space-y-8">
        <div class="flex justify-between items-center border-b pb-3">
          <h2 class="text-xl font-bold text-gray-700">教學核心面板</h2>
          <button onclick="openCardModal()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm flex items-center gap-1 shadow-sm">
            <i class="ph-bold ph-plus"></i> 新增自訂面板
          </button>
        </div>

        <!-- 儀表板卡片格線區 -->
        <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
          <!-- 卡片由 JS 動態渲染 -->
        </div>

        <!-- 首頁底部：實用教學資源外鏈專區 -->
        <div class="bg-white p-6 rounded-xl border border-gray-200 space-y-4 shadow-sm">
          <div class="flex justify-between items-center">
            <h3 class="font-bold text-gray-800 flex items-center gap-2">
              <i class="ph-bold ph-link text-indigo-600"></i> 實用教學資源與大考外鏈
            </h3>
            <button onclick="openResourceModal()" class="text-xs text-indigo-600 hover:underline flex items-center gap-0.5">
              <i class="ph-bold ph-plus"></i> 新增超連結
            </button>
          </div>
          <div id="external-links-container" class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <!-- 外部連結由 JS 動態渲染 -->
          </div>
        </div>
      </section>

      <!-- VIEW 2: 7000 單字庫 -->
      <section id="view-vocab" class="hidden space-y-6">
        <div class="flex justify-between items-center">
          <h2 class="text-xl font-bold text-gray-700">7000 英文字彙與題庫檢索</h2>
          <button onclick="openVocabModal()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm flex items-center gap-1 shadow-sm">
            <i class="ph-bold ph-plus"></i> 新增單字與題目
          </button>
        </div>

        <!-- 篩選列 -->
        <div class="bg-white p-4 rounded-xl border border-gray-200 flex flex-wrap gap-4 items-center">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-gray-500">大考級數：</span>
            <div id="level-filters" class="flex gap-1">
              <!-- Level 1-6 按鈕 -->
            </div>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-gray-500">冊次：</span>
            <select id="book-filter" onchange="renderVocabList()" class="text-xs border rounded px-2 py-1 bg-gray-50">
              <option value="ALL">全部冊次</option>
              <option value="B1">Book 1</option>
              <option value="B2">Book 2</option>
              <option value="B3">Book 3</option>
              <option value="B4">Book 4</option>
              <option value="B5">Book 5</option>
            </select>
          </div>
        </div>

        <!-- 單字卡片列表 -->
        <div id="vocab-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- 單字內容由 JS 產生 -->
        </div>
      </section>

      <!-- VIEW 3: 文法庫 (骨架) -->
      <section id="view-grammar" class="hidden space-y-4">
        <h2 class="text-xl font-bold text-gray-700">核心文法與句型庫</h2>
        <div class="bg-white p-6 rounded-xl border border-gray-200">
          <p class="text-gray-500 text-sm">此處整合常考句型、文法重點、易錯辨析與翻譯練習題。</p>
        </div>
      </section>

      <!-- VIEW 4: 課文資源 (骨架) -->
      <section id="view-textbook" class="hidden space-y-4">
        <h2 class="text-xl font-bold text-gray-700">各版本課文與教學資源</h2>
        <div class="bg-white p-6 rounded-xl border border-gray-200">
          <p class="text-gray-500 text-sm">支援三民、龍騰、全華版本教材之雲端講義與課文解析外鏈。</p>
        </div>
      </section>

      <!-- VIEW 5: 大考試題 (骨架) -->
      <section id="view-exams" class="hidden space-y-4">
        <h2 class="text-xl font-bold text-gray-700">大考試題題型編制</h2>
        <div class="bg-white p-6 rounded-xl border border-gray-200">
          <p class="text-gray-500 text-sm">提供學測字彙題、克漏字、文意選填、混合題型等專案分類題庫。</p>
        </div>
      </section>

    </div>
  </main>

  <!-- 3. 右下角 Gemini 對話懸浮視窗 -->
  <div class="fixed bottom-6 right-6 z-50">
    <button onclick="toggleGeminiChat()" class="bg-indigo-600 hover:bg-indigo-700 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-2xl transition-transform hover:scale-105">
      <i class="ph-bold ph-sparkle"></i>
    </button>

    <!-- 對話抽屜 -->
    <div id="gemini-panel" class="hidden absolute bottom-16 right-0 w-96 bg-white border border-gray-200 rounded-2xl shadow-2xl flex flex-col h-[520px] overflow-hidden">
      <div class="bg-indigo-600 text-white px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2 font-bold text-sm">
          <i class="ph-bold ph-robot"></i> 備課助手 (Gemini)
        </div>
        <button onclick="toggleGeminiChat()" class="text-gray-200 hover:text-white"><i class="ph-bold ph-x"></i></button>
      </div>
      <!-- API Key 設定 -->
      <div class="bg-indigo-50 px-4 py-2 border-b border-indigo-100 flex items-center gap-2">
        <input type="password" id="gemini-api-key" placeholder="貼上 Gemini API Key..." class="text-xs w-full px-2 py-1 border rounded bg-white">
        <button onclick="saveApiKey()" class="text-xs bg-indigo-600 text-white px-2 py-1 rounded">儲存</button>
      </div>
      <!-- 對話訊息視窗 -->
      <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm bg-gray-50">
        <div class="bg-white p-3 rounded-lg border text-gray-600 text-xs shadow-sm">
          老師您好！輸入單字或文法點，我可以立刻為您生成例句或高中文意字彙試題。
        </div>
      </div>
      <!-- 發送區 -->
      <div class="p-3 bg-white border-t flex gap-2">
        <input type="text" id="chat-input" onkeydown="if(event.key==='Enter') sendGeminiMessage()" placeholder="請輸入備課問題..." class="flex-1 text-xs border rounded-lg px-3 py-2 focus:outline-none focus:ring-1 focus:ring-indigo-500">
        <button onclick="sendGeminiMessage()" class="bg-indigo-600 text-white px-3 py-2 rounded-lg text-xs hover:bg-indigo-700"><i class="ph-bold ph-paper-plane-right"></i></button>
      </div>
    </div>
  </div>

  <!-- 單字新增/編輯 Modal 表單 -->
  <div id="vocab-modal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-lg text-gray-800">新增 / 編輯單字題庫</h3>
        <button onclick="closeVocabModal()"><i class="ph-bold ph-x text-gray-400 hover:text-gray-600"></i></button>
      </div>
      <div class="grid grid-cols-2 gap-3 text-sm">
        <div><label class="block text-xs text-gray-500">單字 (Word)</label><input id="v-word" class="w-full border p-1.5 rounded"></div>
        <div><label class="block text-xs text-gray-500">音標 (Phonetic)</label><input id="v-phonetic" class="w-full border p-1.5 rounded"></div>
        <div><label class="block text-xs text-gray-500">詞性 (Part of Speech)</label><input id="v-pos" placeholder="例: v. / n." class="w-full border p-1.5 rounded"></div>
        <div>
          <label class="block text-xs text-gray-500">大考級數 (Level)</label>
          <select id="v-level" class="w-full border p-1.5 rounded bg-white">
            <option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option>
            <option value="4" selected>Level 4</option><option value="5">Level 5</option><option value="6">Level 6</option>
          </select>
        </div>
        <div><label class="block text-xs text-gray-500">教科書冊次 (Book)</label><input id="v-book" placeholder="例: B3U5" class="w-full border p-1.5 rounded"></div>
        <div><label class="block text-xs text-gray-500">中文意思</label><input id="v-chinese" class="w-full border p-1.5 rounded"></div>
        <div class="col-span-2"><label class="block text-xs text-gray-500">英文定義 (English Definition)</label><input id="v-definition" class="w-full border p-1.5 rounded"></div>
        <div class="col-span-2"><label class="block text-xs text-gray-500">搭配詞與慣用語 (Collocations)</label><input id="v-collocation" class="w-full border p-1.5 rounded"></div>
        <div class="col-span-2"><label class="block text-xs text-gray-500">核心例句 (請用 **包覆目標單字**)</label><textarea id="v-sentence" rows="2" class="w-full border p-1.5 rounded"></textarea></div>
        <div class="col-span-2"><label class="block text-xs text-gray-500">文意字彙題幹 (Question Stem)</label><textarea id="v-quiz-q" rows="2" class="w-full border p-1.5 rounded"></textarea></div>
        <div><label class="block text-xs text-gray-500">選項 (逗號分隔)</label><input id="v-quiz-opt" placeholder="A) ..., B) ..., C) ..., D) ..." class="w-full border p-1.5 rounded"></div>
        <div><label class="block text-xs text-gray-500">正解與解析</label><input id="v-quiz-ans" placeholder="例: B (解析說明)" class="w-full border p-1.5 rounded"></div>
        <div class="col-span-2">
          <label class="block text-xs text-gray-500">附加講義/檔案 (PDF, Word, 圖片)</label>
          <input type="file" id="v-file" class="w-full border p-1 rounded text-xs bg-gray-50">
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2 border-t">
        <button onclick="closeVocabModal()" class="px-4 py-1.5 text-sm bg-gray-200 rounded-lg">取消</button>
        <button onclick="saveVocabItem()" class="px-4 py-1.5 text-sm bg-indigo-600 text-white rounded-lg">儲存項目</button>
      </div>
    </div>
  </div>

  <!-- JavaScript 核心驅動 -->
  <script>
    // --- 預設初始資料 ---
    const defaultCards = [
      { id: 'vocab', title: '7000 英文字彙', desc: '含 Level 1-6 檢索、例句與大考文意字彙題型', color: 'bg-amber-700', icon: 'ph-book-bookmark' },
      { id: 'grammar', title: '核心文法與句型庫', desc: '倒裝句、分詞構句等大考必考焦點', color: 'bg-blue-700', icon: 'ph-tree-structure' },
      { id: 'textbook', title: '各版本課文與教學資源', desc: '三民/龍騰/全華課文精華與雲端講義', color: 'bg-emerald-700', icon: 'ph-books' },
      { id: 'exams', title: '大考試題題型編制', desc: '學測題型分析、歷屆題庫與模擬卷', color: 'bg-purple-700', icon: 'ph-exam' }
    ];

    const defaultLinks = [
      { name: '大考中心 (CEEC)', url: 'https://www.ceec.edu.tw/' },
      { name: '劍橋線上詞典', url: 'https://dictionary.cambridge.org/zht/' },
      { name: 'Longman Dictionary', url: 'https://www.ldoceonline.com/' },
      { name: '教育部國教院雙語詞彙', url: 'https://terms.naer.edu.tw/' }
    ];

    const defaultVocab = [
      {
        id: 1, word: 'accommodate', phonetic: '/əˈkɑː.mə.deɪt/', pos: 'v.', level: 5, book: 'B4U3',
        definition: 'to provide with a place to live or to be stored in; to suit the needs of',
        chinese: '容納；提供住宿；順應',
        collocation: 'accommodate the needs of...',
        sentence: 'The newly built auditorium is large enough to **accommodate** over two thousand students.',
        quiz: {
          q: 'The luxury hotel can ________ up to five hundred guests during the international conference peak.',
          opt: '(A) accommodate  (B) eliminate  (C) demonstrate  (D) penetrate',
          ans: '(A) 語意為「容納賓客」，故選 (A)。'
        },
        file: null
      }
    ];

    // 本地持久化資料存取
    let state = {
      cards: JSON.parse(localStorage.getItem('app_cards')) || defaultCards,
      links: JSON.parse(localStorage.getItem('app_links')) || defaultLinks,
      vocab: JSON.parse(localStorage.getItem('app_vocab')) || defaultVocab,
      activeLevel: 'ALL'
    };

    function saveState() {
      localStorage.setItem('app_cards', JSON.stringify(state.cards));
      localStorage.setItem('app_links', JSON.stringify(state.links));
      localStorage.setItem('app_vocab', JSON.stringify(state.vocab));
    }

    // --- 頁面視圖切換 (SPA) ---
    function switchTab(viewId) {
      const views = ['dashboard', 'vocab', 'grammar', 'textbook', 'exams'];
      views.forEach(v => {
        const el = document.getElementById(`view-${v}`);
        if (el) el.classList.toggle('hidden', v !== viewId);
      });

      const titleMap = {
        dashboard: '資訊總覽', vocab: '7000 英文字彙資料庫',
        grammar: '核心文法與句型', textbook: '版本教材與課文資源', exams: '大考試題編制'
      };
      document.getElementById('page-title').innerText = titleMap[viewId] || '備課系統';

      // 導覽按鈕高亮
      document.querySelectorAll('.nav-btn').forEach((btn, idx) => {
        btn.classList.toggle('border-indigo-400', views[idx] === viewId);
        btn.classList.toggle('text-white', views[idx] === viewId);
      });

      if (viewId === 'dashboard') renderDashboard();
      if (viewId === 'vocab') renderVocabList();
    }

    // --- 渲染首頁面板 (需求 1, 2) ---
    function renderDashboard() {
      const grid = document.getElementById('dashboard-grid');
      grid.innerHTML = state.cards.map((c, i) => `
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden flex flex-col hover:shadow-md transition">
          <div class="h-28 ${c.color} p-4 flex justify-between items-start text-white">
            <i class="ph-bold ${c.icon} text-3xl"></i>
            <button onclick="deleteCard(${i})" class="text-white hover:text-red-200 text-sm"><i class="ph-bold ph-trash"></i></button>
          </div>
          <div class="p-5 flex-1 flex flex-col justify-between">
            <div>
              <h4 class="font-bold text-gray-800 text-base mb-1">${c.title}</h4>
              <p class="text-xs text-gray-500">${c.desc}</p>
            </div>
            <button onclick="switchTab('${c.id}')" class="mt-4 w-full py-1.5 bg-gray-50 hover:bg-gray-100 border rounded-lg text-xs font-medium text-gray-700 flex justify-center items-center gap-1">
              進入模組 <i class="ph-bold ph-arrow-right"></i>
            </button>
          </div>
        </div>
      `).join('');

      renderLinks();
    }

    // --- 渲染外部連結 (需求 8) ---
    function renderLinks() {
      const el = document.getElementById('external-links-container');
      el.innerHTML = state.links.map(l => `
        <a href="${l.url}" target="_blank" rel="noopener noreferrer" class="px-3 py-2 bg-gray-50 hover:bg-indigo-50 border border-gray-200 rounded-lg text-xs font-medium text-gray-700 flex items-center justify-between group">
          <span class="truncate">${l.name}</span>
          <i class="ph-bold ph-arrow-square-out text-gray-400 group-hover:text-indigo-600"></i>
        </a>
      `).join('');
    }

    // --- 渲染單字列表 (需求 4, 6) ---
    function renderVocabList() {
      // 級數按鈕列
      const filterBar = document.getElementById('level-filters');
      const levels = ['ALL', '1', '2', '3', '4', '5', '6'];
      filterBar.innerHTML = levels.map(lv => `
        <button onclick="setLevelFilter('${lv}')" class="px-2.5 py-1 text-xs rounded font-medium ${state.activeLevel === lv ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}">
          ${lv === 'ALL' ? '全部' : 'L' + lv}
        </button>
      `).join('');

      const book = document.getElementById('book-filter').value;
      const list = document.getElementById('vocab-list');

      const filtered = state.vocab.filter(v => {
        const matchLv = state.activeLevel === 'ALL' || String(v.level) === state.activeLevel;
        const matchBk = book === 'ALL' || (v.book && v.book.startsWith(book));
        return matchLv && matchBk;
      });

      if (filtered.length === 0) {
        list.innerHTML = `<div class="col-span-2 text-center py-12 text-gray-400 text-sm">無符合條件的單字資料</div>`;
        return;
      }

      list.innerHTML = filtered.map(item => `
        <div class="bg-white border rounded-xl p-5 shadow-sm space-y-3">
          <div class="flex justify-between items-start">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-lg font-bold text-gray-900">${item.word}</span>
                <span class="text-xs text-gray-400">${item.phonetic || ''}</span>
                <span class="text-xs bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded font-medium">${item.pos}</span>
                <span class="text-xs bg-amber-50 text-amber-700 px-1.5 py-0.5 rounded font-medium">L${item.level}</span>
                ${item.book ? `<span class="text-xs bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">${item.book}</span>` : ''}
              </div>
              <p class="text-xs text-gray-600 font-medium mt-1">${item.chinese} <span class="text-gray-400 font-normal">| ${item.definition || ''}</span></p>
            </div>
            <button onclick="copySentence('${escapeQuotes(item.sentence)}')" title="複製例句" class="text-gray-400 hover:text-indigo-600 p-1"><i class="ph-bold ph-copy text-lg"></i></button>
          </div>

          <!-- 核心例句 -->
          <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-100 text-xs text-gray-700">
            <strong>例句：</strong> ${item.sentence.replace(/\*\*(.*?)\*\*/g, '<b class="text-indigo-600">$1</b>')}
          </div>

          <!-- 試題折疊區 -->
          ${item.quiz && item.quiz.q ? `
          <details class="text-xs border rounded-lg p-2.5 bg-gray-50/50">
            <summary class="cursor-pointer font-bold text-gray-600 flex justify-between items-center">
              <span>文意字彙測驗題目</span>
              <button type="button" onclick="copyQuiz('${escapeQuotes(item.quiz.q)}', '${escapeQuotes(item.quiz.opt)}', '${escapeQuotes(item.quiz.ans)}')" class="text-indigo-600 hover:underline text-[11px] ml-2">一鍵複製題目</button>
            </summary>
            <div class="mt-2 space-y-1.5 pt-2 border-t">
              <p class="text-gray-800">${item.quiz.q}</p>
              <p class="text-gray-500">${item.quiz.opt}</p>
              <p class="text-emerald-700 font-semibold pt-1">解答解析：${item.quiz.ans}</p>
            </div>
          </details>
          ` : ''}

          <!-- 附加檔案 (需求 6) -->
          ${item.file ? `
            <div class="pt-1 flex items-center gap-1 text-xs text-indigo-600">
              <i class="ph-bold ph-paperclip"></i>
              <a href="${item.file.data}" download="${item.file.name}" class="hover:underline">${item.file.name}</a>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    function setLevelFilter(lv) {
      state.activeLevel = lv;
      renderVocabList();
    }

    // --- 新增單字與檔案處理 (需求 4, 6) ---
    function openVocabModal() { document.getElementById('vocab-modal').classList.remove('hidden'); }
    function closeVocabModal() { document.getElementById('vocab-modal').classList.add('hidden'); }

    function saveVocabItem() {
      const fileInput = document.getElementById('v-file');
      const newItem = {
        id: Date.now(),
        word: document.getElementById('v-word').value,
        phonetic: document.getElementById('v-phonetic').value,
        pos: document.getElementById('v-pos').value,
        level: parseInt(document.getElementById('v-level').value),
        book: document.getElementById('v-book').value,
        chinese: document.getElementById('v-chinese').value,
        definition: document.getElementById('v-definition').value,
        collocation: document.getElementById('v-collocation').value,
        sentence: document.getElementById('v-sentence').value,
        quiz: {
          q: document.getElementById('v-quiz-q').value,
          opt: document.getElementById('v-quiz-opt').value,
          ans: document.getElementById('v-quiz-ans').value
        },
        file: null
      };

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
          newItem.file = { name: file.name, data: e.target.result };
          state.vocab.unshift(newItem);
          saveState();
          closeVocabModal();
          renderVocabList();
        };
        reader.readAsDataURL(file);
      } else {
        state.vocab.unshift(newItem);
        saveState();
        closeVocabModal();
        renderVocabList();
      }
    }

    // --- 一鍵複製功能 ---
    function copySentence(text) {
      navigator.clipboard.writeText(text.replace(/\*\*/g, '')).then(() => alert('例句已複製至剪貼簿！'));
    }
    function copyQuiz(q, opt, ans) {
      const content = `${q}\n${opt}\n【正解與解析】：${ans}`;
      navigator.clipboard.writeText(content).then(() => alert('完整試題與解析已複製至剪貼簿！'));
    }
    function escapeQuotes(str) { return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

    // --- 全域搜尋 (需求 3) ---
    function handleGlobalSearch(query) {
      const q = query.trim().toLowerCase();
      if (!q) { renderVocabList(); return; }
      if (document.getElementById('view-vocab').classList.contains('hidden')) {
        switchTab('vocab');
      }
      const filtered = state.vocab.filter(v => 
        v.word.toLowerCase().includes(q) || 
        v.chinese.includes(q) || 
        (v.definition && v.definition.toLowerCase().includes(q))
      );
      const list = document.getElementById('vocab-list');
      list.innerHTML = filtered.length ? '' : `<div class="col-span-2 text-center py-12 text-gray-400">搜尋無結果</div>`;
      // 重用渲染邏輯
      filtered.forEach(item => {
        // 動態插入卡片
      });
      renderVocabList();
    }

    // --- 資料備份與共編同步機制 (JSON 匯入匯出) ---
    function exportDataBackup() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `english_bank_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function importDataBackup(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const loaded = JSON.parse(evt.target.result);
          if (loaded.vocab && loaded.cards) {
            state = loaded;
            saveState();
            location.reload();
          } else { alert('檔案格式不相符！'); }
        } catch(err) { alert('JSON 檔案解析失敗'); }
      };
      reader.readAsText(file);
    }

    // --- Gemini 側邊對話視窗 (需求 9) ---
    function toggleGeminiChat() { document.getElementById('gemini-panel').classList.toggle('hidden'); }
    function saveApiKey() {
      const key = document.getElementById('gemini-api-key').value.trim();
      localStorage.setItem('gemini_api_key', key);
      alert('API Key 已安全儲存於瀏覽器！');
    }

    async function sendGeminiMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('gemini-api-key').value.trim();
      if (!text) return;
      if (!apiKey) { alert('請先輸入並儲存您的 Google Gemini API Key'); return; }

      const msgBox = document.getElementById('chat-messages');
      msgBox.innerHTML += `<div class="bg-indigo-600 text-white p-2.5 rounded-lg text-xs ml-8 self-end">${text}</div>`;
      input.value = '';

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: `你是一位高中英文老師的備課助理，請精準回答以下問題或依照大考規範出題：${text}` }] }] })
        });
        const data = await response.json();
        const reply = data.candidates[0].content.parts[0].text;
        msgBox.innerHTML += `<div class="bg-white border p-2.5 rounded-lg text-xs mr-8 text-gray-700 shadow-sm">${reply.replace(/\n/g, '<br>')}</div>`;
        msgBox.scrollTop = msgBox.scrollHeight;
      } catch (e) {
        msgBox.innerHTML += `<div class="bg-red-50 text-red-600 p-2 rounded text-xs">發送失敗，請確認 API Key 是否正確。</div>`;
      }
    }

    // 初始化載入
    window.onload = () => {
      if (localStorage.getItem('gemini_api_key')) {
        document.getElementById('gemini-api-key').value = localStorage.getItem('gemini_api_key');
      }
      renderDashboard();
    };
  </script>
</body>
</html>
